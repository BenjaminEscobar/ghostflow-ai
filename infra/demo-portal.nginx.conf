server {
    # Listens on 8080 inside the container so that, with the backend sharing this network
    # namespace (docker-compose.yml), http://localhost:8080 means the same thing on the
    # host browser and inside the backend's Playwright browser.
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy no-referrer;

    location / {
        try_files $uri $uri/ =404;
    }
}
