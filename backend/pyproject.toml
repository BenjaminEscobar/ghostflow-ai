[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostflow"
version = "0.1.0"
description = "GhostFlow AI - learn web workflows from human demonstrations and replay them safely."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
  # Pinned: the Docker image tag and the local browser build must match this version.
  "playwright==1.63.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["ghostflow*"]

[tool.setuptools.package-data]
"ghostflow.console" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "e2e: needs a real Chromium browser (Playwright); deselect with -m 'not e2e'",
]
